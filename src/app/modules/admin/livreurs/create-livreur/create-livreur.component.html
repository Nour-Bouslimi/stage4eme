<div class="create-livreur">
  <div class="page-header">
    <button class="back-btn" (click)="cancel()">
      <mat-icon>arrow_back</mat-icon>
      Retour
    </button>
    <div>
      <h1 class="page-title">Créer un livreur</h1>
      <p class="page-subtitle">Ajoutez un nouveau livreur à la plateforme</p>
    </div>
  </div>

  <div class="create-container">
    <form [formGroup]="createLivreurForm" class="create-form">
      <div class="form-section">
        <h2 class="section-title">Informations personnelles</h2>
        <div class="form-grid">
          <div class="form-group">
            <label for="prenom">Prénom</label>
            <input id="prenom" type="text" formControlName="prenom" placeholder="Jean" class="form-input" />
          </div>

          <div class="form-group">
            <label for="nom">Nom</label>
            <input id="nom" type="text" formControlName="nom" placeholder="Dupont" class="form-input" />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" formControlName="email" placeholder="jean.dupont@email.com" class="form-input" />
          </div>

          <div class="form-group">
            <label for="telephone">Téléphone</label>
            <input id="telephone" type="tel" formControlName="telephone" placeholder="0612345678" class="form-input" />
          </div>

          <div class="form-group full-width">
            <label for="motDePasse">Mot de passe</label>
            <input id="motDePasse" type="password" formControlName="motDePasse" placeholder="••••••••" class="form-input" />
          </div>
        </div>
      </div>

      <div class="form-section">
        <h2 class="section-title">Informations véhicule</h2>
        <div class="form-grid">
          <div class="form-group">
            <label for="vehiculeType">Type de véhicule</label>
            <select id="vehiculeType" formControlName="vehiculeType" class="form-select">
              <option *ngFor="let type of vehicleTypes" [value]="type.value">
                {{ type.label }}
              </option>
            </select>
          </div>

          <div class="form-group">
            <label for="vehiculeImmatriculation">Immatriculation</label>
            <input id="vehiculeImmatriculation" type="text" formControlName="vehiculeImmatriculation" placeholder="123 TN 1234" class="form-input" />
          </div>

          <div class="form-group">
            <label for="vehiculePoidsMax">Poids max (kg)</label>
            <input id="vehiculePoidsMax" type="number" formControlName="vehiculePoidsMax" min="1" max="5000" class="form-input" />
          </div>

          <div class="form-group">
            <label for="vehiculeVolumeMax">Volume max (m³)</label>
            <input id="vehiculeVolumeMax" type="number" formControlName="vehiculeVolumeMax" min="0.1" step="0.1" class="form-input" />
          </div>

          <div class="form-group full-width">
            <label for="vehiculeRayonService">Rayon de service (km)</label>
            <input id="vehiculeRayonService" type="number" formControlName="vehiculeRayonService" min="1" max="100" class="form-input" />
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="cancel()">
          Annuler
        </button>
        <button type="submit" class="btn-submit" (click)="onSubmit()" [disabled]="loading">
          <span *ngIf="!loading">Créer le livreur</span>
          <span *ngIf="loading">Création en cours...</span>
        </button>
      </div>
    </form>
  </div>
</div>
