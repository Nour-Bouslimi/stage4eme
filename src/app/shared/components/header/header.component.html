<header class="header">
  <div class="header-left">
    <button class="menu-btn" (click)="toggleSidebarClick()">
      <mat-icon>menu</mat-icon>
    </button>
    <div class="breadcrumb">
      <span class="breadcrumb-item">Accueil</span>
      <mat-icon class="breadcrumb-separator">chevron_right</mat-icon>
      <span class="breadcrumb-item active">{{ currentPageTitle }}</span>
    </div>
  </div>

  <div class="header-center">
    <div class="search-bar">
      <mat-icon class="search-icon">search</mat-icon>
      <input type="text" placeholder="Rechercher..." />
    </div>
  </div>

  <div class="header-right">
    <button class="icon-btn" (click)="toggleDarkMode()">
      <mat-icon>{{ darkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>

    <button class="icon-btn notification-btn" (click)="toggleNotifications()">
      <mat-icon>notifications</mat-icon>
      <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
    </button>

    <div class="user-menu-container" *ngIf="userName">
      <button class="user-btn" (click)="toggleUserMenu()">
        <div class="user-avatar">
          <img [src]="userAvatar || 'assets/default-avatar.svg'" alt="Avatar" />
        </div>
        <span class="user-name">{{ userName }}</span>
        <mat-icon class="dropdown-icon">expand_more</mat-icon>
      </button>

      <div class="dropdown-menu" *ngIf="showUserMenu">
        <div class="dropdown-item" (click)="goToProfile()">
          <mat-icon>person</mat-icon>
          <span>Mon profil</span>
        </div>
        <div class="dropdown-item" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Déconnexion</span>
        </div>
      </div>
    </div>
  </div>

  <div class="notification-panel" *ngIf="showNotifications">
    <div class="notification-header">
      <h3>Notifications</h3>
      <button class="mark-read-btn" (click)="markAllAsRead()">
        Tout marquer comme lu
      </button>
    </div>
    <div class="notification-list">
      <div class="notification-item">
        <mat-icon class="notification-icon">local_shipping</mat-icon>
        <div class="notification-content">
          <p class="notification-title">Nouvelle mission disponible</p>
          <p class="notification-text">Une nouvelle mission correspond à votre profil</p>
          <span class="notification-time">Il y a 5 minutes</span>
        </div>
      </div>
      <div class="notification-item unread">
        <mat-icon class="notification-icon">chat</mat-icon>
        <div class="notification-content">
          <p class="notification-title">Nouveau message</p>
          <p class="notification-text">Vous avez reçu un nouveau message</p>
          <span class="notification-time">Il y a 10 minutes</span>
        </div>
      </div>
    </div>
  </div>
</header>
